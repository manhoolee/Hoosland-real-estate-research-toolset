name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check canonical project naming
        run: |
          test -f deploy/systemd/hoosland-real-estate-research-toolset.service.example
          test -f deploy/nginx/hoosland-real-estate-research-toolset.conf.example
          test ! -e deploy/systemd/hoosland-agent-tools.service.example
          test ! -e deploy/nginx/hoosland-agent-tools.conf.example
          git grep -q 'Hoosland-real-estate-research-toolset' -- README.md
          ! git grep -n -I -E 'Hoosland Agent Tools|real-estate-agent-frontend|Real Estate Expert Agent|real-estate-agent-backend' -- . ':!.github/workflows/ci.yml'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -v
          python -m compileall -q app tests
      - name: Run Skill smoke tests
        working-directory: skills
        run: PYTHON=python bash ./tests/run_smoke_tests.sh
      - name: Check deploy Python files
        run: python -m py_compile deploy/*.py deploy/pdf-tool/*.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and build
        working-directory: frontend
        run: |
          npm run check
          npm run build
